stages: [dogrula, entegrasyon, kalite, imaj]

default:
  image: node:22-bookworm-slim
  before_script:
    # node:22-bookworm-slim imajında OpenSSL yok: Prisma sorgu motoru (entegrasyon, e2e) onsuz çalışmaz.
    # Playwright imajı da apt tabanlıdır (Ubuntu); komut orada da çalışır ve OpenSSL'in varlığını garantiler.
    - apt-get update -y && apt-get install -y --no-install-recommends openssl
    - corepack enable
    - pnpm install --frozen-lockfile
  cache:
    key: { files: [pnpm-lock.yaml] }
    paths: [node_modules/]

variables:
  NEXT_TELEMETRY_DISABLED: "1"

dogrula:
  stage: dogrula
  script:
    # Birim testleri Prisma'ya bağımlı modülleri içe aktarır: istemci test öncesi üretilmelidir.
    - pnpm prisma generate
    - pnpm lint
    - pnpm typecheck
    - pnpm test

entegrasyon:
  stage: entegrasyon
  services:
    - name: postgres:17
      alias: postgres
  variables:
    POSTGRES_USER: kbbkira
    POSTGRES_PASSWORD: kbbkira
    POSTGRES_DB: kbbkira_test
    DATABASE_URL: postgresql://kbbkira:kbbkira@postgres:5432/kbbkira_test?schema=public
    SESSION_SECRET: ci-icin-en-az-otuz-iki-karakterlik-gizli-deger
    BELGE_DIZINI: ./var/test-belgeler
  script:
    - pnpm prisma generate
    - pnpm test:integration

mutasyon:
  stage: kalite
  rules:
    - changes: [src/core/**/*, tests/unit/core/**/*]
  script:
    - pnpm prisma generate
    - pnpm test:mutation
  artifacts:
    when: always
    paths: [reports/mutation/]

e2e:
  stage: kalite
  image: mcr.microsoft.com/playwright:v1.62.0-noble
  services:
    - name: postgres:17
      alias: postgres
  variables:
    POSTGRES_USER: kbbkira
    POSTGRES_PASSWORD: kbbkira
    POSTGRES_DB: kbbkira_test
    DATABASE_URL: postgresql://kbbkira:kbbkira@postgres:5432/kbbkira_test?schema=public
    SESSION_SECRET: ci-icin-en-az-otuz-iki-karakterlik-gizli-deger
    BELGE_DIZINI: ./var/test-belgeler
  script:
    - pnpm prisma generate
    - pnpm test:e2e
  artifacts:
    when: on_failure
    paths: [playwright-report/, test-results/]

imaj:
  stage: imaj
  image: docker:27
  services: [docker:27-dind]
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  before_script: []
  cache: []
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - docker build -t "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA" -t "$CI_REGISTRY_IMAGE:latest" .
    - docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"
    - docker push "$CI_REGISTRY_IMAGE:latest"
